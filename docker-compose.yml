version: '3.8'

services:
  lectura-colaborativa:
    image: lectura-colaborativa:latest
    container_name: lectura-colaborativa-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=192.168.18.2
      - DB_PORT=3636
      - DB_USER=root
      - DB_PASS=tu_contraseña_aqui
      - DB_NAME=feryna_collab_reader
      - PORT=5000
    volumes:
      - uploads-data:/app/backend/uploads
    restart: unless-stopped

volumes:
  uploads-data:
